apiVersion: v1
kind: Namespace
metadata:
  name: spark-milvus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-config
  namespace: spark-milvus
data:
  MILVUS_URI: "http://milvus-standalone.milvus-system.svc.cluster.local:19530"
  MILVUS_TOKEN: "root:Milvus"
  MILVUS_DATABASE: "default"
  SPARK_MASTER: "k8s://https://kubernetes.default.svc.cluster.local:443"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: spark-milvus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: spark-milvus
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["create", "get", "watch", "list", "delete", "update"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-rolebinding
  namespace: spark-milvus
subjects:
- kind: ServiceAccount
  name: spark
  namespace: spark-milvus
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-milvus-connector
  namespace: spark-milvus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-milvus-connector
  template:
    metadata:
      labels:
        app: spark-milvus-connector
    spec:
      serviceAccountName: spark
      containers:
      - name: spark-connector
        image: spark-milvus-connector:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4040
          name: spark-ui
        - containerPort: 7077
          name: spark-master
        - containerPort: 8080
          name: web-ui
        env:
        - name: MILVUS_URI
          valueFrom:
            configMapKeyRef:
              name: spark-config
              key: MILVUS_URI
        - name: MILVUS_TOKEN
          valueFrom:
            configMapKeyRef:
              name: spark-config
              key: MILVUS_TOKEN
        - name: MILVUS_DATABASE
          valueFrom:
            configMapKeyRef:
              name: spark-config
              key: MILVUS_DATABASE
        - name: SPARK_MASTER
          value: "local[*]"
        - name: SPARK_MODE
          value: "server"
        - name: SPARK_DRIVER_MEMORY
          value: "2g"
        - name: SPARK_EXECUTOR_MEMORY
          value: "2g"
        - name: SPARK_EXECUTOR_CORES
          value: "2"
        - name: SPARK_EXECUTOR_INSTANCES
          value: "2"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: spark-milvus-connector
  namespace: spark-milvus
spec:
  type: ClusterIP
  selector:
    app: spark-milvus-connector
  ports:
  - port: 4040
    targetPort: 4040
    name: spark-ui
  - port: 7077
    targetPort: 7077
    name: spark-master
  - port: 8080
    targetPort: 8080
    name: web-ui